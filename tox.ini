[tox]
envlist = py{310,311,312,313}-django{42,52}, lint
minversion = 4.10
requires = tox-uv>=1.8

[testenv]
runner = uv-venv-runner
package = editable
extras =
deps =
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
commands = pytest {posargs}

[testenv:lint]
runner = uv-venv-runner
skip_install = true
deps =
    ruff>=0.5.0
    pylint>=3.2
    pylint-django>=2.6
commands =
    ruff check .
    ruff format --check .
    pylint useful tests

